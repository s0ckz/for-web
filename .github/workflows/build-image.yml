name: Build web client image

# Builds the web client into a container image and pushes it to GHCR so a
# self-hosted instance can run it in place of ghcr.io/stoatchat/for-web.

on:
  push:
    branches:
      # main is the trunk now. This is the only workflow that publishes the
      # :latest tag the droplet pulls -- docker-build.yml only tags :main and
      # :<sha> -- so it has to run from main or deploys go stale.
      - main
      - fix/capture-and-shell-stability
      - feat/self-hosted-tweaks
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/for-web

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # stoat.js and solid-livekit-components are submodules; without them
          # rollup cannot resolve "stoat.js" and the vite build dies. The
          # private brand assets submodule is skipped via update=none in
          # .gitmodules, and the client falls back to scripts/assets_fallback.
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache makes iterating on the client tolerable; a cold build of
          # this monorepo takes a long time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
